<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #f5f1e8;
    color: #1a1a1a;
    font-family: "Courier New", "Lucida Console", "Courier", monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    position: relative;
  }
  .glass {
    width: 128px;
    height: 128px;
    margin-bottom: 30px;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  .title {
    font-size: 90px;
    letter-spacing: 18px;
    font-weight: bold;
    margin: 0;
    text-transform: uppercase;
  }
  .tagline {
    font-size: 32px;
    color: #888;
    margin-top: 14px;
    letter-spacing: 2px;
  }
  .corner {
    position: absolute;
    top: 32px;
    left: 32px;
    font-size: 20px;
    color: #888;
  }
  .corner-r {
    position: absolute;
    bottom: 32px;
    right: 32px;
    font-size: 20px;
    color: #888;
  }
  .rule {
    width: 480px;
    border-top: 3px dashed #888;
    margin: 36px 0 10px;
  }
  .dot { color: #888; }
</style>
</head>
<body>
  <div class="corner">slidetackled.com</div>
  <svg class="glass" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
    <!-- Pixel art cocktail glass matching favicon -->
    <rect x="2"  y="1" width="12" height="1" fill="#1a1a1a"/>
    <rect x="2"  y="2" width="1"  height="1" fill="#1a1a1a"/>
    <rect x="14" y="2" width="1"  height="1" fill="#1a1a1a"/>
    <rect x="2"  y="3" width="1"  height="1" fill="#1a1a1a"/>
    <rect x="3"  y="3" width="10" height="1" fill="#bc8c4b"/>
    <rect x="13" y="3" width="1"  height="1" fill="#1a1a1a"/>
    <rect x="3"  y="4" width="1"  height="1" fill="#1a1a1a"/>
    <rect x="4"  y="4" width="8"  height="1" fill="#bc8c4b"/>
    <rect x="12" y="4" width="1"  height="1" fill="#1a1a1a"/>
    <rect x="4"  y="5" width="1"  height="1" fill="#1a1a1a"/>
    <rect x="5"  y="5" width="6"  height="1" fill="#bc8c4b"/>
    <rect x="11" y="5" width="1"  height="1" fill="#1a1a1a"/>
    <rect x="5"  y="6" width="1"  height="1" fill="#1a1a1a"/>
    <rect x="6"  y="6" width="4"  height="1" fill="#bc8c4b"/>
    <rect x="10" y="6" width="1"  height="1" fill="#1a1a1a"/>
    <rect x="6"  y="7" width="1"  height="1" fill="#1a1a1a"/>
    <rect x="7"  y="7" width="2"  height="1" fill="#bc8c4b"/>
    <rect x="9"  y="7" width="1"  height="1" fill="#1a1a1a"/>
    <rect x="7"  y="8" width="2"  height="1" fill="#1a1a1a"/>
    <!-- Stem -->
    <rect x="7"  y="9"  width="2" height="1" fill="#1a1a1a"/>
    <rect x="7"  y="10" width="2" height="1" fill="#1a1a1a"/>
    <rect x="7"  y="11" width="2" height="1" fill="#1a1a1a"/>
    <!-- Base -->
    <rect x="6"  y="12" width="4" height="1" fill="#1a1a1a"/>
    <rect x="5"  y="13" width="6" height="1" fill="#1a1a1a"/>
    <rect x="4"  y="14" width="8" height="1" fill="#1a1a1a"/>
  </svg>
  <h1 class="title">SLIDE TACKLED</h1>
  <div class="rule"></div>
  <p class="tagline">a toast generator</p>
  <div class="corner-r">press <b>POUR</b></div>
</body>
</html>
