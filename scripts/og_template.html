<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #3A6EA5;
    font-family: Tahoma, "MS Sans Serif", Geneva, Verdana, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px;
  }
  .window {
    background: #ECE9D8;
    border: 2px solid;
    border-color: #ffffff #404040 #404040 #ffffff;
    box-shadow: 4px 4px 0 #000;
    width: 1040px;
    padding: 3px;
  }
  .titlebar {
    background: linear-gradient(to right, #0a246a 0%, #2a6bd8 100%);
    color: #fff;
    font-weight: bold;
    font-size: 22px;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 10px;
  }
  .tb-bubble { width: 34px; height: 34px; image-rendering: pixelated; object-fit: contain; }
  .tb-ctrls { margin-left: auto; display: flex; gap: 6px; font-size: 16px; }
  .tb-btn { background: #ECE9D8; color: #000; border: 1px solid #000; padding: 2px 10px; line-height: 1; }
  .tb-close { background: #c43c35; color: #fff; }

  .body {
    background: #fff;
    border: 2px solid;
    border-color: #808080 #ffffff #ffffff #808080;
    margin: 4px;
    padding: 30px 40px;
    display: flex;
    align-items: center;
    gap: 40px;
  }
  /* Left: huge bubble — dominant visual */
  .bubble-big {
    width: 340px;
    height: 340px;
    object-fit: contain;
    image-rendering: pixelated;
    flex: 0 0 auto;
  }
  .right { flex: 1; text-align: left; }
  .wordmark { width: 100%; max-width: 580px; image-rendering: pixelated; display: block; }
  .tag {
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-style: italic;
    color: #1a1a1a;
    font-size: 30px;
    margin: 18px 0 22px;
  }
  .yellow-strip {
    background: #FFDB4C;
    border: 1px solid #000;
    padding: 10px 18px;
    font-size: 20px;
    color: #000;
    font-family: Tahoma, sans-serif;
    display: inline-block;
  }
</style>
</head>
<body>
  <div class="window">
    <div class="titlebar">
      <img class="tb-bubble" src="/Users/bignick/slidetackled/public/brand/bubble.png" alt="">
      <span>slidetackled — Instant Message</span>
      <span class="tb-ctrls">
        <span class="tb-btn">_</span>
        <span class="tb-btn">□</span>
        <span class="tb-btn tb-close">×</span>
      </span>
    </div>
    <div class="body">
      <img class="bubble-big" src="/Users/bignick/slidetackled/public/brand/bubble.png" alt="">
      <div class="right">
        <img class="wordmark" src="/Users/bignick/slidetackled/public/brand/wordmark.png" alt="slidetackled">
        <div class="tag">a toast generator.</div>
        <div class="yellow-strip">press BUZZ. raise your glass. read it aloud.</div>
      </div>
    </div>
  </div>
</body>
</html>
